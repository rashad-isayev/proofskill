name: Bug report
description: Report a reproducible problem using fictional data.
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues before submitting. For security vulnerabilities, use [private reporting](https://github.com/rashad-isayev/proofskill/security/advisories/new) instead.

        Never include API keys, passwords, environment files, real invitation links, candidate data, recordings, or unredacted logs. Use fictional examples. Follow the [contribution policy](https://github.com/rashad-isayev/proofskill/blob/main/docs/CONTRIBUTING.md), including obtaining the owner's permission before running a copy outside GitHub.
  - type: textarea
    id: actual
    attributes:
      label: What happened?
      description: Describe the problem and which part of ProofSkill it affects.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Provide the smallest reproducible example using fictional data.
      placeholder: |
        1. Open...
        2. Select...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Revision and environment
      description: Include the commit SHA, operating system, browser/version, and Node.js version where relevant. Do not paste environment files or credentials.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Optional screenshots or short, redacted error excerpts. Check every attachment for sensitive information before uploading.
